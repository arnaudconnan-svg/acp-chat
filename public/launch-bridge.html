<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Facilitat.io</title>
    <meta name="theme-color" content="#f4f9f9" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #f4f9f9;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        'use strict';

        const LAUNCH_SHORTCUT_SESSION_KEY = 'pendingLaunchShortcut';

        function navigateAway(url, options = {}) {
          document.body.style.animation = 'none';
          document.body.style.transition =
            'opacity 0.32s ease, transform 0.32s ease';
          document.body.style.opacity = '0';
          document.body.style.transform = 'translateY(10px)';
          setTimeout(() => {
            if (options.replace === true) {
              window.location.replace(url);
              return;
            }
            window.location.href = url;
          }, 320);
        }

        const launchBridgeHistoryState = history.state || {};
        if (
          launchBridgeHistoryState.__page !== 'launchBridge' ||
          launchBridgeHistoryState.__guard !== true
        ) {
          history.replaceState(
            { __page: 'launchBridge', __base: true },
            '',
            window.location.href
          );
          history.pushState(
            { __page: 'launchBridge', __guard: true },
            '',
            window.location.href
          );
        }

        window.addEventListener('popstate', (event) => {
          const state = event.state || {};
          if (state.__page === 'launchBridge' && state.__base === true) {
            navigateAway('/?screen=conversationsScreen', { replace: true });
          }
        });

        window.addEventListener('pageshow', () => {
          document.body.style.animation = '';
          document.body.style.transition = '';
          document.body.style.opacity = '';
          document.body.style.transform = '';
        });

        function resolveLaunchShortcut() {
          try {
            const params = new URLSearchParams(window.location.search);
            const launch = String(params.get('launch') || '').trim();
            if (launch === 'new-normal' || launch === 'new-private') {
              return launch;
            }
            return 'new-normal';
          } catch (_) {
            return 'new-normal';
          }
        }

        const launch = resolveLaunchShortcut();
        const launchBridgeNext =
          '/launch-bridge.html?launch=' + encodeURIComponent(launch);

        function storePendingLaunchShortcut() {
          try {
            sessionStorage.setItem(LAUNCH_SHORTCUT_SESSION_KEY, launch);
          } catch (_) {}
        }

        function goToConversationsEntry() {
          storePendingLaunchShortcut();
          window.location.href = '/?screen=conversationsScreen';
        }

        fetch('/api/auth/session', { credentials: 'include' })
          .then((r) => r.json())
          .then((data) => {
            if (data && data.authenticated === true) {
              goToConversationsEntry();
              return;
            }

            navigateAway(
              '/auth.html?next=' + encodeURIComponent(launchBridgeNext),
              { replace: true }
            );
          })
          .catch(() => {
            navigateAway(
              '/auth.html?next=' + encodeURIComponent(launchBridgeNext),
              { replace: true }
            );
          });
      })();
    </script>
  </body>
</html>
